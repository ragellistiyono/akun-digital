<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2A1F4D">
<title>MIWE Digital Store · Prototipe Langit Senja</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Prototipe statis sistem desain. Data di halaman ini contoh buatan. */
:root{
  --langit:#2A1F4D; --langit-2:#3A2D66; --langit-garis:#5B4A92; --langit-teks:#E9E2FF; --langit-redup:#C7BDEA;
  --monogram:#8F61FF; --aksi:#7548F2; --aksi-tekan:#6236DE; --aksi-teks:#6A3FE0;
  --matahari:#EBC967; --persik:#ED9065; --persik-teks:#3A1D0E; --mauve:#9F5F70;
  --tanah:#F7F3FC; --permukaan:#FFFFFF; --permukaan-2:#EFE9FA; --garis:#E4DCF5;
  --tinta:#1E1838; --tinta-redup:#625879;
  --bayang:0 8px 24px -12px rgba(42,31,77,.38); --bayang-naik:0 14px 32px -14px rgba(42,31,77,.5);
  --st-tunggu-bg:#FFF1C9; --st-tunggu:#6E4B00;
  --st-selesai-bg:#DAF3E5; --st-selesai:#18603E;
  --st-kedaluwarsa-bg:#ECE7F2; --st-kedaluwarsa:#554D68;
  --st-batal-bg:#ECEDF0; --st-batal:#4E5460;
  --st-masalah-bg:#FCE0DD; --st-masalah:#9C2820;
  --st-kembali-bg:#DFE8FC; --st-kembali:#22448F;
  --r-chip:999px; --r-input:14px; --r-foto:16px; --r-kartu:20px; --r-besar:24px;
  --font:'Manrope',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-mode="terang"]){
  --langit:#231A42; --langit-2:#33295C; --langit-garis:#4E4180;
  --aksi-teks:#B49BFF; --tanah:#15112A; --permukaan:#211A3D; --permukaan-2:#2C2350; --garis:#3A2F63;
  --tinta:#F3EEFF; --tinta-redup:#B9AFD9; --bayang:0 10px 26px -12px rgba(0,0,0,.65); --bayang-naik:0 16px 34px -14px rgba(0,0,0,.75);
  --st-tunggu-bg:#3B2F0E; --st-tunggu:#F2D27A; --st-selesai-bg:#11352A; --st-selesai:#7FDDB0;
  --st-kedaluwarsa-bg:#2A2440; --st-kedaluwarsa:#C2B9D8; --st-batal-bg:#26272E; --st-batal:#C1C5CE;
  --st-masalah-bg:#3E1B1B; --st-masalah:#FF9C94; --st-kembali-bg:#18244A; --st-kembali:#A4BCFF; color-scheme:dark}}
:root[data-mode="gelap"]{
  --langit:#231A42; --langit-2:#33295C; --langit-garis:#4E4180;
  --aksi-teks:#B49BFF; --tanah:#15112A; --permukaan:#211A3D; --permukaan-2:#2C2350; --garis:#3A2F63;
  --tinta:#F3EEFF; --tinta-redup:#B9AFD9; --bayang:0 10px 26px -12px rgba(0,0,0,.65); --bayang-naik:0 16px 34px -14px rgba(0,0,0,.75);
  --st-tunggu-bg:#3B2F0E; --st-tunggu:#F2D27A; --st-selesai-bg:#11352A; --st-selesai:#7FDDB0;
  --st-kedaluwarsa-bg:#2A2440; --st-kedaluwarsa:#C2B9D8; --st-batal-bg:#26272E; --st-batal:#C1C5CE;
  --st-masalah-bg:#3E1B1B; --st-masalah:#FF9C94; --st-kembali-bg:#18244A; --st-kembali:#A4BCFF; color-scheme:dark}

*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--tanah);-webkit-text-size-adjust:100%}
body{font-family:var(--font);color:var(--tinta);background:var(--tanah);font-size:16px;line-height:1.5;font-variant-numeric:tabular-nums;min-height:100vh;caret-color:var(--aksi)}
::selection{background:var(--aksi);color:#fff}
*{scrollbar-width:thin;scrollbar-color:var(--garis) transparent}
a{color:inherit;text-decoration:none}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--monogram);outline-offset:2px;border-radius:10px}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mono{font-family:var(--mono);font-variant-numeric:normal}

/* ===== Bilah atas (langit) ===== */
.bilah{position:sticky;top:0;z-index:30;background:var(--langit);color:var(--langit-teks);transition:box-shadow .25s,height .25s}
.bilah-isi{height:64px;display:flex;align-items:center;gap:16px;padding:0 16px;max-width:1120px;margin:0 auto;transition:height .25s cubic-bezier(.16,1,.3,1)}
.bilah.ciut .bilah-isi{height:52px}
.bilah.ciut{box-shadow:0 10px 24px -14px rgba(20,14,40,.7)}
.mds{font-weight:800;font-size:28px;letter-spacing:-.045em;color:var(--monogram);line-height:1;transition:font-size .25s}
.bilah.ciut .mds{font-size:24px}
.mds small{display:none;font-size:13px;font-weight:700;letter-spacing:0;color:var(--langit-redup);margin-left:8px}
.bilah-kanan{margin-left:auto;display:flex;align-items:center;gap:8px}
.tbl-langit{height:40px;padding:0 16px;border-radius:var(--r-chip);border:1.5px solid var(--langit-garis);font-weight:700;font-size:14px;color:var(--langit-teks);display:inline-flex;align-items:center}
.tbl-langit:hover{background:var(--langit-2)}
.navatas{display:none}
.judul-bilah{font-weight:800;font-size:18px;letter-spacing:-.01em}
.kembali{width:40px;height:40px;margin-left:-8px;border-radius:12px;display:grid;place-items:center;color:var(--langit-teks)}
.kembali:hover{background:var(--langit-2)}

.pita{background:var(--langit);color:var(--langit-teks);position:relative;height:236px;padding:0 16px;overflow:hidden}
.pita-isi{max-width:1120px;margin:0 auto;position:relative;z-index:1}
.pemandangan{position:absolute;inset:0;overflow:hidden}
.pemandangan svg{position:absolute;inset:0;display:block;width:100%;height:100%}
.butir{position:absolute;inset:0;opacity:.28;mix-blend-mode:soft-light;pointer-events:none}
.cari{display:flex;align-items:center;gap:8px;height:48px;border-radius:16px;background:rgba(24,17,48,.78);border:1px solid rgba(233,226,255,.14);padding:0 16px;color:var(--langit-redup)}
.cari input{flex:1;background:none;border:0;outline:0;color:var(--langit-teks);font-size:16px;min-width:0}
.cari input::placeholder{color:var(--langit-redup)}
.cari:focus-within{outline:3px solid var(--monogram);outline-offset:2px}
.tepi{display:block;position:relative;width:100%;height:44px;background:var(--langit);overflow:hidden}

/* ===== Isi ===== */
main{max-width:1120px;margin:0 auto;padding:8px 16px 112px}
main:has(.lekat){padding-bottom:216px}
h1{font-size:28px;line-height:1.15;font-weight:800;letter-spacing:-.03em}
h2{font-size:22px;line-height:1.2;font-weight:800;letter-spacing:-.02em;margin:32px 0 16px}
.redup{color:var(--tinta-redup)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;margin:0 -16px;padding-inline:16px;scrollbar-width:none}
.chip{flex:none;height:40px;padding:0 16px;border-radius:var(--r-chip);background:var(--permukaan);border:1.5px solid var(--garis);font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:8px;transition:background .2s,border-color .2s}
.chip:hover{border-color:var(--monogram)}
.chip[aria-pressed="true"]{background:var(--langit);border-color:var(--langit);color:#fff}
.foto{border-radius:var(--r-foto);display:flex;align-items:flex-end;padding:12px;color:#fff;font-weight:800;letter-spacing:-.04em;position:relative;overflow:hidden}
.foto span{font-size:32px;line-height:1}
.w-mauve{background:var(--mauve)} .w-persik{background:var(--persik);color:var(--persik-teks)} .w-ungu{background:var(--aksi)} .w-langit{background:#4A3A80} .w-lavender{background:#CFC4EA;color:#2A1F4D}
.unggul{display:grid;grid-template-columns:112px 1fr;gap:16px;background:var(--permukaan);border-radius:var(--r-besar);padding:16px;box-shadow:var(--bayang);transition:transform .2s,box-shadow .2s}
.unggul .foto{min-height:120px}
.kartu{background:var(--permukaan);border-radius:var(--r-kartu);padding:12px;box-shadow:var(--bayang);display:flex;flex-direction:column;transition:transform .2s cubic-bezier(.16,1,.3,1),box-shadow .2s}
.kartu .foto{height:112px}
@media (hover:hover){.kartu:hover,.unggul:hover{transform:translateY(-2px);box-shadow:var(--bayang-naik)}}
.nama{font-weight:800;font-size:16px;letter-spacing:-.01em;line-height:1.25;margin-top:12px}
.unggul .nama{font-size:20px;margin-top:0}
.harga{font-weight:800;font-size:18px;letter-spacing:-.02em;margin-top:4px}
.unggul .harga{font-size:22px;margin-top:8px}
.banding{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px}
.banding .coret{margin-left:0}
.unggul-varian{display:none;list-style:none}
.coret{font-size:14px;color:var(--tinta-redup);text-decoration:line-through;font-weight:600;margin-left:8px}
.baris-kecil{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;font-size:13px;font-weight:700;color:var(--tinta-redup)}
.hemat{background:var(--persik);color:var(--persik-teks);font-weight:800;font-size:12px;padding:4px 8px;border-radius:var(--r-chip)}
.habis-lbl{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:800;color:var(--tinta-redup);background:var(--permukaan-2);padding:4px 8px;border-radius:var(--r-chip)}
.kartu.habis .foto{filter:grayscale(.85);opacity:.55}
.kartu.habis .harga{color:var(--tinta-redup)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.kosong{grid-column:1/-1;background:var(--permukaan);border-radius:var(--r-kartu);padding:24px;text-align:center}
.kosong p{margin-top:8px}

/* ===== Tombol & isian ===== */
.btn{height:52px;border-radius:var(--r-input);padding:0 24px;font-weight:800;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:background .15s,transform .1s}
.btn:active{transform:scale(.98)}
.btn-utama{background:var(--aksi);color:#fff}
.btn-utama:hover{background:var(--aksi-tekan)}
.btn-utama[disabled]{background:var(--permukaan-2);color:var(--tinta-redup);cursor:not-allowed}
.btn-garis{border:1.5px solid var(--garis);color:var(--tinta);background:var(--permukaan)}
.btn-garis:hover{border-color:var(--monogram)}
.btn-lebar{width:100%}
.btn-kecil{height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.lbl{display:block;font-weight:700;font-size:14px;margin-bottom:8px}
.isian{width:100%;height:52px;border-radius:var(--r-input);border:1.5px solid var(--garis);background:var(--permukaan);padding:0 16px;font-size:16px;outline:0;transition:border-color .15s}
.isian:focus{border-color:var(--aksi);box-shadow:0 0 0 3px color-mix(in srgb,var(--monogram) 30%,transparent)}
.isian[aria-invalid="true"]{border-color:var(--st-masalah)}
.bantuan{font-size:13px;color:var(--tinta-redup);margin-top:8px}
.galat{font-size:13px;font-weight:700;color:var(--st-masalah);margin-top:8px;display:flex;gap:4px;align-items:center}
.ok{font-size:13px;font-weight:700;color:var(--st-selesai);margin-top:8px}
.gabung{display:flex;gap:8px}
.gabung .isian{flex:1;text-transform:uppercase}
.dua-kolom{display:grid;gap:24px}
.panel{background:var(--permukaan);border-radius:var(--r-kartu);padding:16px;box-shadow:var(--bayang)}
.panel+.panel{margin-top:16px}

/* ===== Halaman Produk ===== */
.produk-atas .foto{height:220px;border-radius:var(--r-besar)}
.produk-atas .foto span{font-size:72px}
.meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;font-weight:700;color:var(--tinta-redup);margin-top:8px}
.kat-chip{background:var(--permukaan-2);color:var(--aksi-teks);padding:4px 10px;border-radius:var(--r-chip);font-weight:800}
.varian{display:grid;gap:8px;margin-top:16px}
.var{display:grid;grid-template-columns:24px 1fr auto;align-items:center;gap:12px;background:var(--permukaan);border:2px solid var(--garis);border-radius:var(--r-kartu);padding:16px;text-align:left;transition:border-color .15s,background .15s}
.var:hover:not([disabled]){border-color:var(--monogram)}
.var[aria-checked="true"]{border-color:var(--aksi);background:color-mix(in srgb,var(--monogram) 9%,var(--permukaan))}
.var[disabled]{opacity:.6;cursor:not-allowed}
.radio{width:24px;height:24px;border-radius:50%;border:2px solid var(--garis);display:grid;place-items:center}
.var[aria-checked="true"] .radio{border-color:var(--aksi)}
.var[aria-checked="true"] .radio:after{content:"";width:12px;height:12px;border-radius:50%;background:var(--aksi)}
.var b{font-size:16px;font-weight:800;display:block}
.var .r{text-align:right}
.var .r b{font-size:18px}
.teks{font-size:15px;line-height:1.6;color:var(--tinta);max-width:65ch}
.garansi{display:flex;gap:12px;align-items:flex-start}
.garansi svg{color:var(--st-selesai)}
.lekat{position:fixed;left:0;right:0;bottom:76px;z-index:20;padding:12px 16px 26px;background:var(--tanah);border-top:1px solid var(--garis);box-shadow:0 -10px 20px -18px rgba(42,31,77,.45);transition:bottom .3s cubic-bezier(.16,1,.3,1)}
.lekat-isi{max-width:1120px;margin:0 auto;display:flex;gap:12px;align-items:center}
.lekat .btn{flex:1}
body.nav-sembunyi .lekat{bottom:0;padding-bottom:12px}

/* ===== Halaman bayar (tanda khas) ===== */
.senja{position:relative;height:136px;border-radius:var(--r-besar);overflow:hidden;background:var(--langit);isolation:isolate;box-shadow:var(--bayang)}
.waktu{position:absolute;left:16px;top:16px;z-index:2}
.waktu b{display:block;font-size:36px;line-height:1;font-weight:800;letter-spacing:-.03em}
.waktu span{font-size:13px;font-weight:700}
.qr-wadah{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:start;margin:16px 0}
.qr{width:152px;height:152px;background:#fff;border-radius:16px;padding:12px;box-shadow:var(--bayang)}
.qr svg{width:100%;height:100%;display:block}
.contoh{font-size:12px;font-weight:700;color:var(--tinta-redup);margin-top:8px}
.rinci{width:100%;border-collapse:collapse;font-size:15px}
.rinci td{padding:8px 0}
.rinci td:last-child{text-align:right;font-weight:700}
.rinci tr.total td{border-top:1.5px dashed var(--garis);padding-top:16px;font-size:20px;font-weight:800}
.total-langit{position:absolute;right:16px;top:16px;z-index:2;text-align:right}
.total-langit span{display:block;font-size:13px;font-weight:700}
.total-langit b{font-size:24px;font-weight:800;letter-spacing:-.02em}

/* ===== Status ===== */
.status{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 12px 0 8px;border-radius:var(--r-chip);font-size:13px;font-weight:800;white-space:nowrap}
.status svg.i{width:16px;height:16px;stroke-width:2.4}
.st-tunggu{background:var(--st-tunggu-bg);color:var(--st-tunggu)}
.st-selesai{background:var(--st-selesai-bg);color:var(--st-selesai)}
.st-kedaluwarsa{background:var(--st-kedaluwarsa-bg);color:var(--st-kedaluwarsa)}
.st-batal{background:var(--st-batal-bg);color:var(--st-batal)}
.st-masalah{background:var(--st-masalah-bg);color:var(--st-masalah)}
.st-kembali{background:var(--st-kembali-bg);color:var(--st-kembali)}

/* ===== Halaman Pesanan ===== */
.nomor{font-family:var(--mono);font-weight:700;font-size:30px;letter-spacing:.01em;line-height:1.1;margin-top:8px;word-break:break-all}
.item{background:var(--langit);color:var(--langit-teks);border-radius:var(--r-besar);padding:8px 16px;margin-top:16px}
.item-baris{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px;padding:12px 0;border-bottom:1px solid var(--langit-garis)}
.item-baris:last-child{border-bottom:0}
.item-baris small{display:block;font-size:12px;font-weight:700;color:var(--langit-redup)}
.item-baris .mono{font-size:15px;font-weight:500;color:#fff;overflow-wrap:anywhere}
.salin{height:40px;padding:0 12px;border-radius:12px;background:var(--langit-2);color:var(--langit-teks);font-weight:800;font-size:14px;display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--langit-garis)}
.salin:hover{border-color:var(--monogram)}
.salin.tersalin{background:var(--st-selesai-bg);color:var(--st-selesai);border-color:transparent}
.salin svg.i{width:18px;height:18px}
.ajakan{border:2px solid var(--monogram)}

/* ===== Riwayat ===== */
.daftar{display:grid;gap:12px}
.psn{background:var(--permukaan);border-radius:var(--r-kartu);padding:16px;box-shadow:var(--bayang);display:grid;grid-template-columns:1fr auto;gap:8px 16px;align-items:center}
.psn .nm{grid-column:1/-1;font-weight:800}
.psn .status{justify-self:start}
.psn .mono{font-size:13px;font-weight:700;color:var(--tinta-redup)}
.psn .tot{font-weight:800;text-align:right}

/* ===== Akun ===== */
.segmen{display:grid;grid-template-columns:repeat(3,1fr);background:var(--permukaan-2);border-radius:var(--r-input);padding:4px;gap:4px}
.segmen button{height:44px;border-radius:10px;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--tinta-redup)}
.segmen button[aria-checked="true"]{background:var(--permukaan);color:var(--tinta);box-shadow:var(--bayang)}
.segmen svg.i{width:18px;height:18px}
.tautan{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;font-weight:700;color:var(--aksi-teks);margin-top:24px}
.tautan a{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1.5px}

/* ===== Navigasi bawah ===== */
.navbawah{position:fixed;left:0;right:0;bottom:0;z-index:40;height:76px;padding-bottom:env(safe-area-inset-bottom);background:var(--permukaan);border-top:1px solid var(--garis);transition:transform .3s cubic-bezier(.16,1,.3,1)}
body.nav-sembunyi .navbawah{transform:translateY(100%)}
.navbawah ul{list-style:none;display:grid;grid-template-columns:repeat(4,1fr);height:100%;position:relative}
.navbawah a{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:700;color:var(--tinta-redup)}
.navbawah a[aria-current="page"]{color:var(--tinta)}
.surya{position:absolute;top:-1px;left:0;width:25%;height:14px;pointer-events:none;transition:transform .45s cubic-bezier(.16,1,.3,1)}
.surya:before{content:"";position:absolute;left:50%;top:-13px;width:28px;height:14px;margin-left:-14px;border-radius:14px 14px 0 0;background:var(--matahari);box-shadow:0 -2px 14px 3px rgba(235,201,103,.55)}
.toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,16px);opacity:0;z-index:50;background:var(--langit);color:#fff;font-weight:700;font-size:14px;padding:12px 16px;border-radius:var(--r-chip);box-shadow:var(--bayang-naik);transition:opacity .2s,transform .3s cubic-bezier(.16,1,.3,1);pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.sim{margin-top:16px;padding:12px;border:1.5px dashed var(--garis);border-radius:var(--r-input);font-size:13px;color:var(--tinta-redup)}
.sim b{color:var(--tinta)}
.sim .gabung{margin-top:8px;flex-wrap:wrap}

/* ===== Layar lebar ===== */
@media (min-width:900px){
  .navbawah,.lekat .ket-ponsel{display:none}
  .navatas{display:flex;gap:4px;margin-left:24px;position:relative}
  .navatas a{height:40px;padding:0 16px;border-radius:12px;display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:15px;color:var(--langit-redup);position:relative}
  .navatas a:hover{background:var(--langit-2);color:var(--langit-teks)}
  .navatas a[aria-current="page"]{color:#fff}
  .navatas .surya{top:auto;bottom:-12px;width:auto;height:10px}

<script>
/* Data contoh buatan untuk prototipe. */
const PRODUK = [
  {id:'netflix', nama:'Netflix Premium', kat:'Streaming', w:'w-mauve', unggul:true,
   desk:'Akun sharing satu profil untuk menonton di satu perangkat. Item stok berisi email, password, dan nama profil.',

  {id:'spotify', nama:'Spotify Premium', kat:'Musik', w:'w-persik', varian:[{id:'1b',nama:'1 Bulan',harga:25000,normal:null,stok:8}],
   desk:'Akun individu tanpa iklan.', garansi:'Garansi 30 hari.', kolom:['Email','Password']},
  {id:'youtube', nama:'YouTube Premium', kat:'Streaming', w:'w-ungu', varian:[{id:'1b',nama:'1 Bulan',harga:20000,normal:null,stok:0},{id:'3b',nama:'3 Bulan',harga:55000,normal:65000,stok:3}],
   desk:'Undangan keluarga YouTube Premium.', garansi:'Garansi 30 hari.', kolom:['Email','Password']},
  {id:'canva', nama:'Canva Pro', kat:'Desain', w:'w-lavender', varian:[{id:'1b',nama:'1 Bulan',harga:15000,normal:null,stok:0}],
   desk:'Undangan tim Canva Pro.', garansi:'Garansi 14 hari.', kolom:['Email']},
  {id:'disney', nama:'Disney+ Hotstar', kat:'Streaming', w:'w-langit', varian:[{id:'1b',nama:'1 Bulan',harga:35000,normal:40000,stok:21}],
   desk:'Akun sharing satu profil.', garansi:'Garansi 30 hari.', kolom:['Email','Password','Profil']},
  {id:'genshin', nama:'Kode Redeem Game', kat:'Game', w:'w-mauve', varian:[{id:'60',nama:'60 Kristal',harga:16000,normal:null,stok:40}],
   desk:'Kode redeem resmi, tukar di halaman isi ulang game.', garansi:'Kode dijamin belum pernah dipakai.', kolom:['Kode']},
];
const KATEGORI = ['Streaming','Musik','Desain','Game'];
const VOUCHER = {HEMAT5:{jenis:'nominal',nilai:5000}, HEMAT10:{jenis:'persen',nilai:10,maks:10000,minimal:50000}};
const RIWAYAT = [
  {no:'MIWE-7K3P9Q', p:'Netflix Premium · 1 Bulan', t:'11 Nov 2026, 20.14 WIB', tot:45123, st:'Selesai'},
  {no:'MIWE-H4ZR2M', p:'Spotify Premium · 1 Bulan', t:'11 Nov 2026, 19.52 WIB', tot:25211, st:'Menunggu Pembayaran'},
  {no:'MIWE-QW8C5T', p:'YouTube Premium · 3 Bulan', t:'10 Nov 2026, 22.05 WIB', tot:55389, st:'Bermasalah'},
  {no:'MIWE-B6NXJ3', p:'Canva Pro · 1 Bulan', t:'9 Nov 2026, 08.40 WIB', tot:15077, st:'Kedaluwarsa'},
  {no:'MIWE-5PDK7A', p:'Disney+ Hotstar · 1 Bulan', t:'8 Nov 2026, 13.22 WIB', tot:35498, st:'Dibatalkan'},
  {no:'MIWE-T9GM4E', p:'Netflix Premium · 3 Bulan', t:'2 Nov 2026, 21.10 WIB', tot:135302, st:'Dana Dikembalikan'},
];
const STATUS = {'Menunggu Pembayaran':['st-tunggu','i-jam'],'Selesai':['st-selesai','i-cek'],'Kedaluwarsa':['st-kedaluwarsa','i-pasir'],
  'Dibatalkan':['st-batal','i-silang'],'Bermasalah':['st-masalah','i-awas'],'Dana Dikembalikan':['st-kembali','i-kembali']};

const rp = n => 'Rp ' + n.toLocaleString('id-ID');
const persenHemat = (normal, jual) => Math.floor((normal - jual) * 100 / normal);
const tersedia = p => p.varian.filter(v => v.stok > 0);
const ikon = id => `<svg class="i" aria-hidden="true"><use href="#${id}"/></svg>`;
const badge = st => `<span class="status ${STATUS[st][0]}">${ikon(STATUS[st][1])}${st}</span>`;
let kondisi = {kat:null, cari:'', produk:'netflix', varian:'1b', email:'', voucher:null, pesanan:null, timer:null, member:new URLSearchParams(location.search).get('member') === '1'};

function hargaKartu(p){
  const ada = tersedia(p), aktif = p.varian;
  const sumber = ada.length ? ada : aktif;
  const min = Math.min(...sumber.map(v => v.harga));
  return {mulai: aktif.length > 1, harga: min, habis: !ada.length};
}
function kartu(p, besar){
  const h = hargaKartu(p), ada = tersedia(p);
  const v = (ada.length ? ada : p.varian).find(x => x.harga === h.harga);
  const coret = v && v.normal ? `<span class="coret">${rp(v.normal)}</span>` : '';
  const hemat = v && v.normal && !h.habis ? `<span class="hemat">Hemat ${persenHemat(v.normal, v.harga)}%</span>` : '';
  const habis = h.habis ? `<span class="habis-lbl">Habis</span>` : '';
  const banding = coret || hemat || habis ? `<div class="banding">${coret}${hemat}${habis}</div>` : '';
  const label = `${h.mulai ? 'Mulai ' : ''}${rp(h.harga)}`;
  if (besar) return `<a class="unggul" href="#/produk/${p.id}"><div class="foto ${p.w}" aria-hidden="true"><span>${p.nama[0]}</span></div>
    <div><div class="nama">${p.nama}</div><div class="meta"><span class="kat-chip">${p.kat}</span><span>${p.varian.length} Varian</span></div>
    <div class="harga">${label}</div>${banding}</div>
    <ul class="unggul-varian">${p.varian.map(x => `<li><span>${x.nama}</span><span>${x.stok ? `${x.normal ? `<s>${rp(x.normal)}</s>` : ''}${rp(x.harga)}` : '<span class="habis-lbl">Habis</span>'}</span></li>`).join('')}</ul></a>`;
  return `<a class="kartu${h.habis?' habis':''}" href="#/produk/${p.id}"><div class="foto ${p.w}" aria-hidden="true"><span>${p.nama[0]}</span></div>
    <div class="nama">${p.nama}</div><div class="harga">${label}</div>${banding}</a>`;
}

/* ===== Bilah atas per halaman ===== */
const NAVATAS = `<nav class="navatas" aria-label="Navigasi utama"><a href="#/" data-tab="0">Beranda</a><a href="#/kategori" data-tab="1">Kategori</a><a href="#/riwayat" data-tab="2">Riwayat</a><a href="#/akun" data-tab="3">Akun</a><span class="surya" id="surya-atas" aria-hidden="true"></span></nav>`;
function bilahUtama(){
  return `<a class="mds" href="#/" aria-label="MIWE Digital Store, beranda">MDS<small>MIWE Digital Store</small></a>${NAVATAS}
    <div class="bilah-kanan">${kondisi.member ? `<a class="tbl-langit" href="#/akun" aria-label="Akun Budi">${ikon('i-akun')}Budi</a>` : `<a class="tbl-langit" href="#/akun">Masuk</a>`}</div>`;
}
function bilahDalam(judul, ke){
  return `<a class="kembali" href="${ke}" aria-label="Kembali">${ikon('i-kiri')}</a><span class="judul-bilah">${judul}</span>${NAVATAS}`;
}
const GUNUNG = `<div class="pemandangan" data-pemandangan="pita" aria-hidden="true"></div>`;
const TEPI = `<div class="tepi" aria-hidden="true"><div class="pemandangan" data-pemandangan="tepi"></div></div>`;

/* ===== Halaman ===== */
function beranda(){
  const q = kondisi.cari.toLowerCase();
  const daftar = PRODUK.filter(p => (!kondisi.kat || p.kat === kondisi.kat) && p.nama.toLowerCase().includes(q));
  const unggul = PRODUK.filter(p => p.unggul);
  return {
    bilah: bilahUtama(),
    pita: `<section class="pita">${GUNUNG}<div class="pita-isi"><label class="cari">${ikon('i-cari')}<span class="sr">Cari Produk</span>
      <input id="cari" type="search" placeholder="Cari Netflix, Spotify, Canva…" value="${kondisi.cari}" autocomplete="off"></label></div></section>`,
    isi: `<div class="chips" role="group" aria-label="Saring menurut Kategori">
      <button class="chip" aria-pressed="${!kondisi.kat}" data-kat="">Semua</button>
      ${KATEGORI.map(k => `<button class="chip" aria-pressed="${kondisi.kat===k}" data-kat="${k}">${k}</button>`).join('')}</div>
      ${!kondisi.kat && !q ? `<h2>Produk Unggulan</h2>${unggul.map(p => kartu(p, true)).join('')}` : ''}
      <h2>${kondisi.kat || (q ? 'Hasil pencarian' : 'Semua Produk')}</h2>
      <div class="grid">${daftar.length ? daftar.map(p => kartu(p)).join('') :
        `<div class="kosong"><b>Produk "${kondisi.cari}" belum ada</b><p class="redup">Coba nama lain, atau lihat semua Kategori.</p></div>`}</div>`
  };
}
function kategori(){
  return {bilah: bilahUtama(), pita: TEPI, isi: `<h1 style="margin-top:16px">Kategori</h1><div class="daftar" style="margin-top:24px">
    ${KATEGORI.map(k => { const n = PRODUK.filter(p=>p.kat===k).length;
      return `<a class="psn" href="#/" data-kat-ke="${k}"><b style="font-size:18px">${k}</b><span class="redup" style="text-align:right">${n} Produk</span></a>`; }).join('')}</div>`};
}
function produk(id){
  const p = PRODUK.find(x => x.id === id) || PRODUK[0];
  if (kondisi.produk !== p.id){ kondisi.produk = p.id; kondisi.varian = (tersedia(p)[0] || p.varian[0]).id; }
  const v = p.varian.find(x => x.id === kondisi.varian);
  const satu = p.varian.length === 1;
  return {bilah: bilahDalam(p.nama, '#/'), pita: TEPI, isi: `<div class="dua-kolom produk-atas">
    <div class="foto ${p.w}" aria-hidden="true"><span>${p.nama[0]}</span></div>
    <div><h1>${p.nama}</h1><div class="meta"><a class="kat-chip" href="#/" data-kat-ke="${p.kat}">${p.kat}</a><span>${p.varian.length} Varian</span></div>
      ${satu ? `<div class="harga" style="font-size:28px;margin-top:8px">${rp(v.harga)}</div><div class="baris-kecil" style="justify-content:flex-start">${v.stok?`Stok ${v.stok}`:'<span class="habis-lbl">Habis</span>'}</div>` :
      `<h2 style="margin:24px 0 0;font-size:18px">Pilih Varian</h2><div class="varian" role="radiogroup" aria-label="Varian">${p.varian.map(x => `
        <button class="var" role="radio" aria-checked="${x.id===kondisi.varian}" data-var="${x.id}" ${x.stok?'':'disabled aria-disabled="true"'}>
          <span class="radio" aria-hidden="true"></span>
          <span><b>${x.nama}</b><span class="redup" style="font-size:13px;font-weight:700">${x.stok?`Stok ${x.stok}`:'Habis'}</span></span>
          <span class="r"><b>${rp(x.harga)}</b>${x.normal?`<span class="coret" style="display:block;margin:0">${rp(x.normal)}</span><span class="hemat">Hemat ${persenHemat(x.normal,x.harga)}%</span>`:''}</span>
        </button>`).join('')}</div>`}
      <div class="panel" style="margin-top:24px"><p class="teks">${p.desk}</p></div>
      <div class="panel"><div class="garansi">${ikon('i-perisai')}<p class="teks">${p.garansi}</p></div>
        <a class="btn btn-garis btn-kecil" style="margin-top:16px" href="#/produk/${p.id}">${ikon('i-chat')}Tanya lewat WhatsApp</a></div>
      <div class="lekat"><div class="lekat-isi"><button class="btn btn-utama" id="beli" ${v.stok?'':'disabled'}>${v.stok?`Beli · ${rp(v.harga)}`:'Habis'}</button></div></div>
    </div></div>`};
}
function potongan(harga){
  const kode = kondisi.voucher; if (!kode) return 0;
  const vc = VOUCHER[kode]; let dasar = vc.jenis === 'nominal' ? vc.nilai : Math.floor(harga * vc.nilai / 100);
  if (vc.maks) dasar = Math.min(dasar, vc.maks);
  return Math.max(0, Math.min(dasar, harga - 1000));
}
function checkout(){
  const p = PRODUK.find(x => x.id === kondisi.produk), v = p.varian.find(x => x.id === kondisi.varian);
  const pot = potongan(v.harga);
  return {bilah: bilahDalam('Checkout', '#/produk/' + p.id), pita: TEPI, isi: `<div class="dua-kolom">
    <form id="form-co" novalidate>
      <h1 style="margin-top:16px">Checkout</h1>
      <div class="panel" style="margin-top:24px"><b>${p.nama}</b> <span class="redup">· ${v.nama}</span></div>
      <div style="margin-top:24px"><label class="lbl" for="email">Email</label>
        <input class="isian" id="email" type="email" inputmode="email" autocomplete="email" placeholder="nama@email.com" value="${kondisi.email}" aria-describedby="email-ket">
        <p class="bantuan" id="email-ket">Pastikan email benar, detail pesanan dikirim ke sini.</p></div>
      <div style="margin-top:24px"><label class="lbl" for="voucher">Kode voucher <span class="redup" style="font-weight:600">(opsional)</span></label>
        <div class="gabung"><input class="isian" id="voucher" autocomplete="off" placeholder="HEMAT5" value="${kondisi.voucher||''}">
        <button class="btn btn-garis" type="button" id="pakai">Pakai</button></div><div id="voucher-ket" aria-live="polite">${kondisi.voucher?`<p class="ok">Voucher ${kondisi.voucher} dipakai: potongan ${rp(pot)}</p>`:''}</div></div>
    </form>
    <div><div class="panel" style="margin-top:24px"><table class="rinci"><tbody>
      <tr><td>Harga jual</td><td>${rp(v.harga)}</td></tr>
      <tr><td>Potongan voucher</td><td>${pot?'− '+rp(pot):'Rp 0'}</td></tr>
      <tr><td>Kode unik</td><td class="redup">Rp 1–499, dari Qrispy</td></tr>
      <tr class="total"><td>Perkiraan bayar</td><td>${rp(v.harga - pot)} + kode unik</td></tr></tbody></table></div>
      <p class="bantuan">Dengan membayar, Anda menyetujui <a href="#/akun" style="color:var(--aksi-teks);text-decoration:underline;text-underline-offset:3px">Syarat &amp; Ketentuan</a>.</p>
      <div class="lekat"><div class="lekat-isi"><button class="btn btn-utama" id="bayar" form="form-co" type="submit">Bayar dengan QRIS</button></div></div></div></div>`};
}
function qrContoh(){
  let s = 7, rnd = () => (s = (s * 9301 + 49297) % 233280) / 233280, n = 29, out = '';
  const finder = (x, y) => `<rect x="${x}" y="${y}" width="7" height="7" fill="#15112A"/><rect x="${x+1}" y="${y+1}" width="5" height="5" fill="#fff"/><rect x="${x+2}" y="${y+2}" width="3" height="3" fill="#15112A"/>`;
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++){
    const diFinder = (x < 8 && y < 8) || (x > n-9 && y < 8) || (x < 8 && y > n-9);
    if (!diFinder && rnd() > .52) out += `<rect x="${x}" y="${y}" width="1" height="1"/>`;
  }
  return `<svg viewBox="0 0 ${n} ${n}" shape-rendering="crispEdges" role="img" aria-label="Gambar QR contoh"><g fill="#15112A">${out}</g>${finder(0,0)}${finder(n-7,0)}${finder(0,n-7)}</svg>`;
}
function bayar(){
  if (!kondisi.pesanan) kondisi.pesanan = {no:'MIWE-7K3P9Q', produk:'Netflix Premium', varian:'1 Bulan', harga:50000, pot:5000, kode:123, kolom:['Email','Password','Profil'], email:'budi@contoh.id', batas:Date.now() + 900000 - (+new URLSearchParams(location.search).get('lewat') || 0) * 1000};
  const o = kondisi.pesanan;

function pasang(){
  const cari = document.getElementById('cari');
  if (cari) cari.addEventListener('input', e => { kondisi.cari = e.target.value; const pos = e.target.selectionStart; tampilkan(); const c = document.getElementById('cari'); c.focus(); c.setSelectionRange(pos, pos); });
  document.querySelectorAll('[data-kat]').forEach(b => b.onclick = () => { kondisi.kat = b.dataset.kat || null; tampilkan(); });
  document.querySelectorAll('[data-kat-ke]').forEach(a => a.onclick = () => { kondisi.kat = a.dataset.katKe; });
  document.querySelectorAll('[data-var]').forEach(b => b.onclick = () => { kondisi.varian = b.dataset.var; tampilkan(); });
  const beli = document.getElementById('beli'); if (beli) beli.onclick = () => { location.hash = '#/checkout'; };
  const pakai = document.getElementById('pakai');
  if (pakai) pakai.onclick = () => {
    const kode = document.getElementById('voucher').value.trim().toUpperCase(), ket = document.getElementById('voucher-ket');
    kondisi.email = document.getElementById('email').value;
    if (!kode){ kondisi.voucher = null; return tampilkan(); }
    if (!VOUCHER[kode]){ ket.innerHTML = `<p class="galat">${ikon('i-awas')}Kode voucher tidak ditemukan</p>`; document.getElementById('voucher').setAttribute('aria-invalid','true'); return; }
    const p = PRODUK.find(x => x.id === kondisi.produk), v = p.varian.find(x => x.id === kondisi.varian), vc = VOUCHER[kode];
    if (vc.minimal && v.harga < vc.minimal){ ket.innerHTML = `<p class="galat">${ikon('i-awas')}Minimal pembelian ${rp(vc.minimal)}</p>`; return; }
    kondisi.voucher = kode; tampilkan();
  };
  const form = document.getElementById('form-co');
  if (form) form.onsubmit = e => {
    e.preventDefault(); const em = document.getElementById('email'); kondisi.email = em.value.trim();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(kondisi.email)){
      em.setAttribute('aria-invalid','true'); document.getElementById('email-ket').outerHTML = `<p class="galat" id="email-ket">${ikon('i-awas')}Tulis email yang lengkap, misalnya nama@email.com</p>`; em.focus(); return; }
    const p = PRODUK.find(x => x.id === kondisi.produk), v = p.varian.find(x => x.id === kondisi.varian);
    kondisi.pesanan = {no:'MIWE-7K3P9Q', produk:p.nama, varian:v.nama, harga:v.harga, pot:potongan(v.harga), kode:123, kolom:p.kolom, email:kondisi.email, batas:Date.now() + 900000};
    location.hash = '#/bayar';
  };
  const ids = {'simpan-qr':() => toast('Gambar QR tersimpan ke galeri'), 'batal':() => { kondisi.pesanan = null; toast('Pesanan dibatalkan'); location.hash = '#/'; },
    'sim-maju':() => { kondisi.pesanan.batas -= 300000; }, 'sim-member':() => { kondisi.member = true; tampilkan(); toast('Masuk sebagai Member'); }, 'keluar':() => { kondisi.member = false; tampilkan(); toast('Anda sudah keluar'); }, 'sim-bayar':() => { location.hash = '#/pesanan'; toast('Pembayaran masuk'); },
    'buat-akun':() => { const pw = document.getElementById('pw'); if (pw.value.length < 8){ pw.setAttribute('aria-invalid','true'); toast('Password minimal 8 karakter'); pw.focus(); } else toast('Kode verifikasi dikirim ke email'); }};
  Object.entries(ids).forEach(([id, f]) => { const el = document.getElementById(id); if (el) el.onclick = f; });
  document.querySelectorAll('[data-salin]').forEach(b => b.onclick = async () => {
    try { await navigator.clipboard.writeText(b.dataset.salin); } catch(e){}
    b.classList.add('tersalin'); b.querySelector('span').textContent = 'Tersalin'; b.querySelector('use').setAttribute('href', '#i-cek');
    setTimeout(() => { b.classList.remove('tersalin'); b.querySelector('span').textContent = 'Salin'; b.querySelector('use').setAttribute('href', '#i-salin'); }, 1600);
  });
  document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => { terapkanMode(b.dataset.mode); tampilkan(); });
}

/* ===== Bilah mengecil dan navigasi bawah bersembunyi saat digulir ===== */
let yLalu = window.scrollY;
window.addEventListener('scroll', () => {
  const y = window.scrollY, turun = y > yLalu;
  document.getElementById('bilah').classList.toggle('ciut', y > 24);
  if (Math.abs(y - yLalu) > 6){ document.body.classList.toggle('nav-sembunyi', turun && y > 120); yLalu = y; }
}, {passive:true});
window.addEventListener('hashchange', tampilkan);
let jedaUbah; window.addEventListener('resize', () => { clearTimeout(jedaUbah); jedaUbah = setTimeout(() => { lukisSemua(); const b = document.querySelector('[data-pemandangan="bayar"]'); if (b) b.innerHTML = ''; }, 120); });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', lukisSemua);
window.addEventListener('resize', () => geserSurya(+(document.querySelector('[data-tab][aria-current]')||{dataset:{tab:0}}).dataset.tab));
tampilkan();
</script>
</body>
